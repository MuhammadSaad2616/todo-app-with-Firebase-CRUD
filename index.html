<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <div class="container">
        <h1>Todo List</h1>

        <div class="prog"><i id="bar"></i></div>
        <p class="count" id="count"></p>

        <div class="input-box">
            <input type="text" id="todo-inp" placeholder="What needs doing?">
            <button id="addBtn" onClick="addTodo()">add</button>
            <button id="delAllBtn" onClick="deleteAllTodos()">delete all</button>
        </div>

        <div class="todo-lists"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
