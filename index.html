<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list (Firebase)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-do list</h1>
    <p class="status" id="status">Connecting...</p>
    <form id="form">
      <input type="text" id="text" placeholder="What needs doing?" maxlength="200" autocomplete="off" aria-label="New task">
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
