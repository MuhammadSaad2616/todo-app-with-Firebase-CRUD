<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <main>
    <h1>To-do list</h1>
    <div class="prog"><i id="bar"></i></div>
    <p class="status" id="status">Connecting...</p>
    <form id="form">
      <input type="text" id="text" placeholder="What needs doing?" maxlength="200" autocomplete="off" aria-label="New task">
      <button class="add" type="submit">+ Add</button>
    </form>
    <ul id="list"></ul>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
